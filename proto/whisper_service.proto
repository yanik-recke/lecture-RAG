syntax = "proto3";

package whisperservice;

import "lecture_service.proto";
import "lecture_store.proto";


service WhisperService {
  rpc Transcribe(lectureservice.TranscribeRes) returns (TranscribedRes);
}

message Transcription {
  string full_text = 1;
  repeated Chunk chunks = 2;
}

message Chunk {
  string text = 1;

  lecturestore.Timestamp timestamp = 2;
}

message TranscribedRes {
  Transcription payload = 1;
}
