syntax="proto3";

package completionservice;

service CompletionService {
  rpc Complete(CompletionReq) returns (CompletionRes);
}

message Prompt {
  string prompt = 1;
}

message CompletionReq {
  Prompt payload = 1;
}

message Response {
  string response = 1;
}

message CompletionRes {
  Response payload = 1;
}